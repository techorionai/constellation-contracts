openapi: 3.0.0
info:
  title: Constellation Common Models
  version: 0.0.0
tags: []
paths: {}
components:
  schemas:
    AccessTokenClaims:
      type: object
      required:
        - iss
        - sub
        - aud
        - exp
        - iat
        - jti
        - client_id
        - scope
        - principal_type
      properties:
        iss:
          type: string
          format: uri
          description: 'Issuer of the token: the URL of the identity service.'
        sub:
          type: string
          description: 'ID of the principal: a user, a service, an agent, or a workflow.'
        aud:
          anyOf:
            - $ref: '#/components/schemas/AppKey'
            - $ref: '#/components/schemas/AppKeyList'
          description: 'Audience of the token: one application key, or an array of application keys.'
        exp:
          type: integer
          format: int64
          description: Expiry time in seconds since the Unix epoch.
        iat:
          type: integer
          format: int64
          description: Issue time in seconds since the Unix epoch.
        nbf:
          type: integer
          format: int64
          description: Time in seconds since the Unix epoch before which a verifier must not accept the token.
        jti:
          type: string
          description: Unique ID of the token.
        client_id:
          type: string
          description: ID of the client that asked for the token.
        scope:
          allOf:
            - $ref: '#/components/schemas/ScopeString'
          description: Permission keys that the token grants.
        principal_type:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the principal in `sub`.
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: |-
            The key of the app of the service client. It is not the audience.
            Only access tokens from the client credentials grant have it, with `principal_type` `service`.
            Exchange tokens, user tokens, and API tokens do not have it.
            A verifier uses `app` only when `principal_type` is `service`.
        act:
          allOf:
            - $ref: '#/components/schemas/ActorClaim'
          description: |-
            The agent that acts for the subject. The identity service sets it for a token exchange with an actor.
            `act.principal_type` is `agent`. `act.sub` is the ID of the agent.
        amr:
          type: array
          items:
            $ref: '#/components/schemas/AuthenticationMethod'
          description: |-
            The methods that the user used for the login of the session.
            Only in user tokens from the code flow and from refresh.
            Not in service, agent, workflow, or exchange tokens.
            Absent when the session has no recorded method.
        auth_time:
          type: integer
          format: int64
          description: The time of the last login of the session, in seconds since the Unix epoch. Only in user tokens from the code flow and from refresh.
      description: |-
        Claims of an access token (RFC 9068).
        The JWT header `typ` is `at+jwt`. The header `alg` is `ES256`.
        The identity service writes `aud` as one string and always sets `nbf`.
        A verifier accepts both forms of `aud`.
    ActorClaim:
      type: object
      required:
        - sub
        - principal_type
      properties:
        sub:
          type: string
          description: ID of the acting principal.
        principal_type:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the acting principal.
      description: The agent that acts for the subject of a token. It has one level. It has no nested `act`.
    AppKey:
      type: string
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]*$
      description: Key of an application, for example `helpdesk` or `customer_portal`.
    AppKeyList:
      type: array
      items:
        $ref: '#/components/schemas/AppKey'
      minItems: 1
      description: One or more application keys. Use it as the audience of a token.
    AuditEntryData:
      type: object
      required:
        - action
        - result
      properties:
        action:
          allOf:
            - $ref: '#/components/schemas/PermissionKey'
          description: The action, for example `identity:mfa:passkey_rename`.
        result:
          allOf:
            - $ref: '#/components/schemas/AuditResult'
          description: Result of the action.
        target:
          allOf:
            - $ref: '#/components/schemas/AuditTarget'
          description: The resource that the action acted on.
        summary:
          type: string
          minLength: 1
          maxLength: 1024
          description: Short text for a person. It has no secret, no token, and no password.
        details:
          type: object
          additionalProperties: {}
          description: Details of the action as a JSON object. It has a maximum of 16 KiB in JSON. It has no secret, no token, and no password.
        requestId:
          type: string
          minLength: 1
          maxLength: 128
          description: The `X-Request-ID` of the request.
        ipAddress:
          type: string
          minLength: 1
          maxLength: 45
          description: IP address of the client. A valid IPv4 or IPv6 address in text form, with no port and no zone. A reader refuses another value.
        userAgent:
          type: string
          minLength: 1
          maxLength: 512
          description: The `User-Agent` of the request.
      description: |-
        Data of an audit entry. The time, the actor, `act`, the service, and the trace ID are in the envelope of the event.
        `action` is an action key in the form of a `PermissionKey`. It starts with `<app>:` of the producer.
        It does not have to be a key of the manifest of the producer.
        `summary` and `details` contain no secret, no token, and no password.
    AuditRecordedEvent:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - data
        - actor
        - actortype
      properties:
        specversion:
          type: string
          enum:
            - '1.0'
          description: CloudEvents version.
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: ID of the event. Unique for each `source`.
        source:
          type: string
          minLength: 1
          maxLength: 256
          format: uri-reference
          description: URI reference of the service that made the event, for example `/helpdesk`.
        type:
          allOf:
            - $ref: '#/components/schemas/EventType'
          description: Type of the event.
        time:
          type: string
          format: date-time
          description: Time when the event happened.
        subject:
          type: string
          minLength: 1
          maxLength: 256
          description: ID of the resource, for example the ticket ID.
        datacontenttype:
          type: string
          enum:
            - application/json
          description: Media type of `data`.
        dataschema:
          type: string
          format: uri
          description: URI of the schema of `data`.
        data:
          allOf:
            - $ref: '#/components/schemas/AuditEntryData'
          description: Data of the event.
        actor:
          type: string
          minLength: 1
          maxLength: 128
          description: 'The `sub` of the token: the ID of the principal.'
        actortype:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the principal in `actor`.
        act:
          type: string
          minLength: 1
          maxLength: 128
          description: 'The `act` of the token: the agent that acts for the user.'
        acttype:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the principal in `act`. Set `act` and `acttype` together, or set neither.
        traceparent:
          type: string
          pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
          description: W3C trace context (CloudEvents distributed tracing extension).
      description: |-
        An audit entry as a CloudEvent. The audit transport rules are:

        1. A service writes the audit entry in the same database transaction as the change. The audit outbox of `constellation-platform-go` does this.
        2. The relay adds the entry to the Valkey stream `audit.stream:<app>`. Each stream entry has one field `event` with the CloudEvent in JSON.
        3. `source` is `/<app>`. `type` is `<app>.audit.recorded`. `id` is a UUID in lowercase text form (UUIDv7 recommended) and is unique for the app.
        The audit service removes duplicates by `source` and `id`. The schema of the shared `CloudEvent` does not express the UUID rule.
        4. `actor`, `actortype`, `act`, and `acttype` come from the verified principal of the request, never from request data.
        An entry with no request principal has the client ID of the producer as `actor` and `service` as `actortype`.
        `act` is the agent for an action of an agent for a user. It is the proposer for an action that a user approved.
        5. `time` is the time of the action.
        6. Only the audit service reads audit streams. A service writes only to its own audit stream.
        7. The full CloudEvent has a maximum of 64 KiB.
        8. A reader ignores an unknown member of `data` and of the envelope. It does not refuse the entry for this reason.
    AuditResult:
      type: string
      enum:
        - success
        - denied
        - invalid
        - failure
      description: Result of an audited action.
    AuditTarget:
      type: object
      required:
        - type
        - id
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AuditTargetType'
          description: Type of the resource.
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: ID of the resource.
      description: The resource that an audited action acted on.
    AuditTargetType:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,63}$
      description: Type of the target of an audited action, for example `ticket`.
    AuthenticationMethod:
      anyOf:
        - type: string
        - type: string
          enum:
            - pwd
            - otp
            - rec
            - hwk
            - user
            - fed
            - mfa
      description: |-
        A method that the user used for the login of a session (RFC 8176).
        RFC 8176 registers all values except `rec` and `fed`. The registered values are not a complete set.
        The values are `pwd` (password), `otp` (TOTP code), `rec` (recovery code),
        `hwk` (passkey), `user` (user verification of a passkey), `fed` (upstream OIDC login),
        and `mfa` (two or more factors, or one passkey with user verification).
        A service that needs MFA checks that `amr` contains `mfa`. It does not check the other values.
    BadRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request is not valid.
    CloudEventEnvelope:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - data
        - actor
        - actortype
      properties:
        specversion:
          type: string
          enum:
            - '1.0'
          description: CloudEvents version.
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: ID of the event. Unique for each `source`.
        source:
          type: string
          minLength: 1
          maxLength: 256
          format: uri-reference
          description: URI reference of the service that made the event, for example `/helpdesk`.
        type:
          allOf:
            - $ref: '#/components/schemas/EventType'
          description: Type of the event.
        time:
          type: string
          format: date-time
          description: Time when the event happened.
        subject:
          type: string
          minLength: 1
          maxLength: 256
          description: ID of the resource, for example the ticket ID.
        datacontenttype:
          type: string
          enum:
            - application/json
          description: Media type of `data`.
        dataschema:
          type: string
          format: uri
          description: URI of the schema of `data`.
        data:
          type: object
          additionalProperties: {}
          description: Data of the event.
        actor:
          type: string
          minLength: 1
          maxLength: 128
          description: 'The `sub` of the token: the ID of the principal.'
        actortype:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the principal in `actor`.
        act:
          type: string
          minLength: 1
          maxLength: 128
          description: 'The `act` of the token: the agent that acts for the user.'
        acttype:
          allOf:
            - $ref: '#/components/schemas/PrincipalType'
          description: Type of the principal in `act`. Set `act` and `acttype` together, or set neither.
        traceparent:
          type: string
          pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
          description: W3C trace context (CloudEvents distributed tracing extension).
      description: A CloudEvent when the type of `data` is not known.
    Conflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request conflicts with the state of the resource.
    ContentTooLarge:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: |-
        The request body is larger than the limit of the service. The code is `content_too_large`.
        The operator of the service sets the limit.
    CursorPageParams:
      type: object
      properties:
        pageToken:
          type: string
          maxLength: 1024
          description: Opaque token from `nextPageToken` of the previous page.
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
          description: Maximum number of items in the page.
          default: 50
      description: Query parameters of a list operation with cursor pagination.
    EventType:
      type: string
      maxLength: 128
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$
      description: Type of an event, for example `helpdesk.ticket.created`.
    EventTypeDefinition:
      type: object
      required:
        - type
        - description
        - dataSchema
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/EventType'
          description: Type of the event.
        description:
          type: string
          description: Description of the event. It is untrusted text from the producer. A consumer must escape it and must not treat it as instructions.
        dataSchema:
          type: object
          additionalProperties: {}
          description: JSON Schema (draft 2020-12) document for `data`. It is untrusted data from the producer. A reference in it must be local.
        deprecated:
          type: boolean
          description: True if the event type is deprecated.
      description: One event type that a service publishes.
    EventTypeRegistration:
      type: object
      required:
        - source
        - app
        - eventTypes
      properties:
        source:
          type: string
          description: The `source` of the events of the service.
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the application.
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/EventTypeDefinition'
          description: Event types of the application.
      description: The event types that a service registers with the events service.
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON Pointer to the incorrect value.
        code:
          type: string
          description: Stable code that a machine can read.
        message:
          type: string
          description: Message for a person.
      description: One incorrect field of a request.
    Forbidden:
      type: object
      properties:
        missingScopes:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
          description: Permissions that the principal lacks. An agent uses them to ask the user for approval.
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The principal does not have the permission.
    InternalServerError:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The server has an internal error.
    LinkTemplate:
      type: object
      required:
        - resourceType
        - template
      properties:
        resourceType:
          allOf:
            - $ref: '#/components/schemas/ResourceType'
          description: Type of the resource.
        template:
          type: string
          pattern: ^(?!.*\.\.)\{base_url\}/[A-Za-z0-9._~/%-]*(\{[a-z_][a-z0-9_]*\}[A-Za-z0-9._~/%-]*)*$
          format: uri-template
          description: |-
            RFC 6570 level 1 path template. It starts with `{base_url}/`. It has no `..`, no `@`, no `?`,
            no `#`, and no reserved expansion such as `{+id}`. Example: `{base_url}/tickets/{id}`.
        description:
          type: string
          description: Description of the link.
      description: Maps a resource type to a URL template.
    LinkTemplateSet:
      type: object
      required:
        - app
        - baseUrl
        - templates
      properties:
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the application.
        baseUrl:
          type: string
          format: uri
          pattern: ^(https://[A-Za-z0-9.-]+|http://localhost)(:[0-9]{1,5})?(/(?!\.{1,2}(/|$))[A-Za-z0-9._~%-]+)*$
          description: |-
            Value that replaces `{base_url}`. It is `https://` and a host, or `http://localhost` for
            development, with an optional port and an optional path prefix, for example
            `https://example.com/helpdesk`. A path segment is not `.` or `..`. It has no `/` at the end,
            no user info, no query, and no fragment.
        templates:
          type: array
          items:
            $ref: '#/components/schemas/LinkTemplate'
          description: Link templates of the application.
      description: The link templates of one application.
    NotFound:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The resource does not exist.
    PermissionDefinition:
      type: object
      required:
        - key
        - description
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/PermissionKey'
          description: Key of the permission.
        description:
          type: string
          description: Description of what the permission allows.
      description: One permission that a service defines.
    PermissionKey:
      type: string
      maxLength: 128
      pattern: ^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin)$
      description: |-
        Key of a permission in the form `<app>:<resource>:<action>`, for example `helpdesk:ticket:write`.
        The only exception is `identity:admin`, the permission of full administration of the identity service.
    PermissionManifest:
      type: object
      required:
        - app
        - permissions
        - defaultRoles
      properties:
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the application that owns the permissions.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionDefinition'
          description: Permissions that the application defines.
        defaultRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'
          description: Default roles of the application.
      description: The permissions and default roles that a service publishes.
    PrincipalType:
      type: string
      enum:
        - user
        - agent
        - service
        - workflow
      description: Type of a principal.
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          description: URI reference that identifies the problem type.
          default: about:blank
        title:
          type: string
          description: Short summary of the problem. It contains no internal data.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence of the problem. It contains no internal data.
        instance:
          type: string
          description: URI reference of this occurrence. It contains no personal data and no secret.
        code:
          type: string
          maxLength: 64
          description: Stable code that a machine can read, for example `ticket_not_found`.
        requestId:
          type: string
          description: ID of the request. An operator uses it to find the error in the logs.
        traceId:
          type: string
          description: ID of the trace. An operator uses it to find the error in the traces.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Field errors. Only for validation errors.
      description: Problem details for an HTTP API (RFC 9457).
    ReauthenticationRequired:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: |-
        The token does not show a fresh login or a fresh MFA login (RFC 9470). The code is `reauthentication_required`.
        A fresh login needs `auth_time` at most 5 minutes old. A fresh MFA login also needs `mfa` in `amr`.
        The client must start a new authorization request with `max_age`. A token refresh does not help.
        The header `WWW-Authenticate` is optional in this model, because the 401 response of an operation also covers `Unauthorized`.
        An operation that uses this model always sends the header with the code `reauthentication_required`.
    RequestScopeString:
      type: string
      maxLength: 4096
      pattern: '^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin|openid|profile|email|offline_access)(?: (?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin|openid|profile|email|offline_access))*$'
      description: |-
        Space-separated scope values in a token request or an authorize request.
        Each value is a permission key or one of `openid`, `profile`, `email`, and `offline_access`.
    ResourceType:
      type: string
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]*$
      description: Type of a resource, for example `ticket`.
    RoleDefinition:
      type: object
      required:
        - key
        - name
        - description
        - permissions
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/RoleKey'
          description: Key of the role.
        name:
          type: string
          description: Display name of the role.
        description:
          type: string
          description: Description of the role.
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
          description: Permissions that the role grants.
      description: A default role of a service, with its permissions.
    RoleKey:
      type: string
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]*$
      description: Key of a role, for example `agent_admin`.
    RoleRef:
      type: string
      maxLength: 97
      pattern: ^[a-z][a-z0-9_]*:[a-z][a-z0-9_]*$
      description: Reference to a role in the form `<app>:<role>`, for example `helpdesk:agent`.
    ScopeString:
      type: string
      maxLength: 4096
      pattern: '^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin)(?: (?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin))*$'
      description: |-
        Space-separated permission keys, for example `helpdesk:ticket:read helpdesk:ticket:write`.
        It holds permission keys only. It never holds an OIDC scope.
    ServiceUnavailable:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The service is not available.
    TooManyRequests:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The client sent too many requests.
    Unauthorized:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request has no valid credentials.
    UnprocessableContent:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request is well formed, but the server cannot process its content.
