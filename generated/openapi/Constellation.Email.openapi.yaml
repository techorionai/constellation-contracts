        variables:
          type: object
          additionalProperties:
            type: string
          description: Values of the variables. The key is a variable name. A maximum of 50 variables. Each value has a maximum of 10000 characters.
      description: A template and its variables for a send request.
    TemplateSendRequest:
      type: object
      required:
        - from
        - to
        - template
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
