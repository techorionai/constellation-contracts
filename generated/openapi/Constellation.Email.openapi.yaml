security:
  - BearerAuth: []
components:
  parameters:
    CursorPageParams.pageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
      explode: false
    CursorPageParams.pageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque token from `nextPageToken` of the previous page.
      schema:
        type: string
        maxLength: 1024
      explode: false
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Key of the request. The same key with the same body returns the first result.
      schema:
        type: string
        pattern: ^[ -~]+$
        minLength: 1
        maxLength: 255
    MessageFilters.createdFrom:
      name: createdFrom
      in: query
      required: false
      description: Show only messages with `createdAt` at or after this time.
      schema:
        type: string
        format: date-time
      explode: false
    MessageFilters.createdTo:
      name: createdTo
      in: query
      required: false
      description: Show only messages with `createdAt` before this time.
      schema:
        type: string
        format: date-time
      explode: false
    MessageFilters.status:
      name: status
