          description: Variables of the template.
        createdAt:
          type: string
          format: date-time
          description: Time when the template was created.
        updatedAt:
          type: string
          format: date-time
          description: Time when the template was changed.
      description: An email template. The subject, the text, and the HTML use Go template syntax.
    TemplateCreate:
      type: object
      required:
        - key
        - subject
        - text
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,63}$
          description: Unique key of the template.
        description:
          type: string
          maxLength: 500
          description: Description.
        subject:
          type: string
          minLength: 1
          maxLength: 998
          description: Subject template.
        text:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Text template.
        html:
          type: string
          minLength: 1
          maxLength: 1048576
          description: HTML template.
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVariable'
          maxItems: 50
          description: Variables of the template.
      description: Request to create a template.
    TemplatePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of templates.
    TemplateReference:
