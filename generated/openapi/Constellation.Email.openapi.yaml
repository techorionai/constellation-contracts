          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: ID of the suppression.
        address:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: The suppressed address.
        reason:
          allOf:
            - $ref: '#/components/schemas/SuppressionReason'
          description: Reason of the suppression.
        messageId:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: ID of the message that caused the suppression.
        createdAt:
          type: string
          format: date-time
          description: Time when the suppression was created.
      description: An address that the service does not send to.
    SuppressionCreate:
      type: object
      required:
        - address
      properties:
        address:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: The address to suppress.
      description: Request to create a manual suppression. The reason is `manual`.
    SuppressionLookup:
      type: object
      required:
        - address
      properties:
        address:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: The address. The match is exact and has no case.
      description: |-
        Request to find one suppression by address. The address is in the body and not in the URL,
        because logs and traces keep a URL.
    SuppressionPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Suppression'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of suppressions.
    SuppressionReason:
      type: string
      enum:
        - bounce
        - complaint
        - manual
      description: Reason of a suppression.
    Template:
