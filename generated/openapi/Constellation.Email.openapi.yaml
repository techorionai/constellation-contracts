openapi: 3.0.0
info:
  title: Constellation Email
  description: |-
    The email service API. Clients send messages and manage templates, sender rules, and suppressions.
    The audience of the service is `email`.
    The permission manifest of the service is in `services/email/manifest.json`.
    The event types of the service are in `services/email/events/event-types.json`.
  version: 0.0.0
tags: []
paths:
  /v1/messages:
    post:
      operationId: Messages_send
      description: |-
        Send a message. The body has `template` or `content`. A body with both or with neither is not valid.
        The service puts the message in a queue and returns 202 with the `Message`. The status is `queued`,
        or `suppressed` when all recipients are on the suppression list. The caller reads the status later or from the events.
        Limits: `to` has 1 to 50 addresses. The total of `to`, `cc`, and `bcc` is a maximum of 50 addresses.
        A schema cannot count 3 arrays, so the service checks the total and gives 422 `validation_failed`.
        The service also gives 422 `validation_failed` for more than 50 template variables.
        The body has a maximum of 2 MiB. A larger body gives 413 `content_too_large`.
        The header `Idempotency-Key` is optional. The service keeps a key for each caller app for 24 hours.
        The same key with the same body returns the first `Message` with 202.
        The same key with a different body gives 422 `idempotency_key_reused`.
        A retry with the same key while the first request is in progress gives 409 `idempotency_request_in_progress` with `Retry-After`.
        A principal with no `app` claim gives 422 `sender_not_allowed`. A `from` address that no sender rule of the caller app allows also gives 422 `sender_not_allowed`.
        Other codes of `UnprocessableContent`: `template_not_found`, `template_variables_invalid`.
        Each response, also an error response, has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '202':
          description: A 202 response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: The request is not valid. The response has the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailBadRequest'
        '401':
          description: The request has no valid credentials. The response has the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailUnauthorized'
        '403':
          description: The principal does not have the permission. The response has the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailForbidden'
        '409':
          description: The request conflicts with the state of the resource. The response has the no-store headers. It has an optional Retry-After header.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailConflict'
        '413':
          description: The request body is too large. The response has the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailContentTooLarge'
        '422':
          description: The request is well formed, but the service cannot process its content. The response has the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailUnprocessableContent'
        '429':
          description: The client sent too many requests. The response has the no-store headers.
          headers:
            Retry-After:
              required: true
              description: Seconds to wait before the next request.
              schema:
                type: integer
                format: int32
                minimum: 0
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailTooManyRequests'
        '500':
          description: The service has an internal error. The response has the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailInternalServerError'
        '503':
          description: The service is not available. The response has the no-store headers.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EmailServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      x-required-scopes:
        - email:message:send
    get:
      operationId: Messages_list
      description: |-
        List the messages. The order is `createdAt` descending, then `id` descending.
        The page token is opaque. A token of another operation or with other filters gives 400 `invalid_page_token`.
        A principal with `email:message:read` sees only the messages of its own `app` claim. A principal with no `app` claim sees no message with this permission only.
        A principal with `email:message:read_all` sees all messages.
        The service deletes a message 24 hours after `sendAt`. The list does not show a deleted message.
        No filter has an address.
        Each response, also an error response, has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - $ref: '#/components/parameters/CursorPageParams.pageToken'
        - $ref: '#/components/parameters/CursorPageParams.pageSize'
        - $ref: '#/components/parameters/MessageFilters.status'
        - $ref: '#/components/parameters/MessageFilters.createdFrom'
        - $ref: '#/components/parameters/MessageFilters.createdTo'
