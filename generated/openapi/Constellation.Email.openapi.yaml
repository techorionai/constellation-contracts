        fromName:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name of the sender.
        to:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          minItems: 1
          maxItems: 50
          description: Recipients.
        cc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          maxItems: 50
          description: Copy recipients.
        bcc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          maxItems: 50
          description: Blind copy recipients.
        replyTo:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
