        subject:
          type: string
          minLength: 1
          maxLength: 998
          description: Subject template.
        text:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Text template.
        html:
          type: string
          minLength: 1
          maxLength: 1048576
          description: HTML template.
        variables:
          type: array
          items:
            $ref: '#/components/schemas/TemplateVariable'
