    EventAppKey:
      type: string
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]*$
      description: Key of the app that sent the message.
    EventResourceId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      format: uuid
      description: A UUID in lowercase text form. The pattern is RE2 syntax.
    EventType:
      type: string
      maxLength: 128
      pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$
      description: Type of an event, for example `helpdesk.ticket.created`.
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: JSON Pointer to the incorrect value.
        code:
          type: string
          description: Stable code that a machine can read.
        message:
          type: string
          description: Message for a person.
      description: One incorrect field of a request.
    Message:
      type: object
      required:
        - id
        - senderApp
        - status
        - from
        - recipients
        - attempts
        - sendAt
        - createdAt
        - updatedAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: ID of the message.
        senderApp:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the app that sent the message.
        status:
          allOf:
            - $ref: '#/components/schemas/MessageStatus'
          description: Status of the message.
        from:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: Address of the sender.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/MessageRecipient'
          description: Recipients of the message.
        templateKey:
          type: string
          description: Key of the template. Only if the message used a template.
        attempts:
          type: integer
          format: int32
          minimum: 0
          description: Number of send attempts.
        sendAt:
          type: string
          format: date-time
          description: Time when the service starts to send the message.
        createdAt:
          type: string
          format: date-time
          description: Time when the message was accepted.
        updatedAt:
          type: string
          format: date-time
          description: Time when the message was changed.
        sentAt:
          type: string
          format: date-time
          description: Time when the service sent the message.
        failureCode:
          allOf:
            - $ref: '#/components/schemas/EmailFailureCode'
          description: Reason of the failure. Only for the status `failed`.
      description: |-
        A message in the queue or sent. It has the metadata and the status for each recipient.
        It does not have the subject, the text, the HTML, or the template variables.
        The service deletes a message 24 hours after `sendAt`. After this time, a read gives 404 `message_not_found`.
    MessageContent:
      type: object
      required:
        - subject
        - text
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 998
          description: Subject.
        text:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Text body. A maximum of 1 MiB.
        html:
          type: string
          minLength: 1
          maxLength: 1048576
          description: HTML body. A maximum of 1 MiB.
      description: Message content that the caller gives.
    MessagePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: Items of the page.
        nextPageToken:
          type: string
          description: Token for the next page. No value means that this is the last page.
      description: One page of messages.
    MessageRecipient:
      type: object
      required:
        - address
        - kind
        - status
      properties:
        address:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: Email address of the recipient.
        kind:
          allOf:
            - $ref: '#/components/schemas/RecipientKind'
          description: Kind of the recipient.
        status:
          allOf:
            - $ref: '#/components/schemas/RecipientStatus'
          description: Status of the recipient.
        bounceType:
          allOf:
            - $ref: '#/components/schemas/EmailBounceType'
          description: Type of the bounce. Only for the status `bounced`.
      description: One recipient of a message.
    MessageStatus:
      type: string
      enum:
        - queued
        - sending
        - sent
        - partially_sent
        - failed
        - suppressed
      description: Status of a message.
    MessageThreading:
      type: object
      properties:
        inReplyTo:
          type: string
          minLength: 1
          maxLength: 998
          description: Message ID of the message that this message answers.
        references:
          type: array
          items:
            type: string
          maxItems: 100
          description: Message IDs of the thread.
      description: Message IDs for a thread.
    PermissionKey:
      type: string
      maxLength: 128
      pattern: ^(?:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*|identity:admin)$
      description: |-
        Key of a permission in the form `<app>:<resource>:<action>`, for example `helpdesk:ticket:write`.
        The only exception is `identity:admin`, the permission of full administration of the identity service.
    PrincipalType:
      type: string
      enum:
        - user
        - agent
        - service
        - workflow
      description: Type of a principal.
    RecipientKind:
      type: string
      enum:
        - to
        - cc
        - bcc
      description: Kind of a recipient.
    RecipientStatus:
      type: string
      enum:
        - pending
        - sent
        - delivered
        - bounced
        - complained
        - suppressed
        - failed
      description: |-
        Status of a recipient. A delivery notification changes only the status of the recipient.
        The status of the message stays `sent` or `partially_sent`.
    ResourceId:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      format: uuid
      description: A UUID in lowercase text form. The pattern is RE2 syntax.
    SendMessageFields:
      type: object
      required:
        - from
        - to
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: Address of the sender. A sender rule of the caller app must allow it.
        fromName:
          type: string
          minLength: 1
          maxLength: 100
          description: Display name of the sender.
        to:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          minItems: 1
          maxItems: 50
          description: Recipients.
        cc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          maxItems: 50
          description: Copy recipients.
        bcc:
          type: array
          items:
            $ref: '#/components/schemas/EmailAddress'
          maxItems: 50
          description: Blind copy recipients.
        replyTo:
          allOf:
            - $ref: '#/components/schemas/EmailAddress'
          description: Address for replies.
        threading:
          allOf:
            - $ref: '#/components/schemas/MessageThreading'
          description: Fields to put the message in a thread.
        sendAt:
          type: string
          format: date-time
          description: Send time. A maximum of 7 days after the request. The default is now.
      description: Fields that all send requests have.
    SendMessageRequest:
      oneOf:
        - $ref: '#/components/schemas/TemplateSendRequest'
        - $ref: '#/components/schemas/ContentSendRequest'
      description: Request to send a message. The body has `template` or `content`. A body with both is not valid.
    SenderRule:
      type: object
      required:
        - id
        - app
        - kind
        - value
        - createdAt
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ResourceId'
          description: ID of the rule.
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the app that the rule applies to.
        kind:
          allOf:
            - $ref: '#/components/schemas/SenderRuleKind'
          description: Kind of the rule.
        value:
          type: string
          minLength: 1
          maxLength: 254
          description: The domain or the address.
        createdAt:
          type: string
          format: date-time
          description: Time when the rule was created.
      description: A rule that lets an app send from a domain or from an address.
    SenderRuleCreate:
      type: object
      required:
        - app
        - kind
        - value
      properties:
        app:
          allOf:
            - $ref: '#/components/schemas/AppKey'
          description: Key of the app that the rule applies to.
        kind:
          allOf:
            - $ref: '#/components/schemas/SenderRuleKind'
          description: Kind of the rule.
        value:
          type: string
          minLength: 1
          maxLength: 254
          description: The domain or the address.
      description: Request to create a sender rule.
    SenderRuleKind:
