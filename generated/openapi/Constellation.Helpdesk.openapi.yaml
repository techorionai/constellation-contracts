openapi: 3.0.0
info:
  title: Constellation Helpdesk
  description: |-
    The helpdesk service API. Clients manage customers and tickets.
    The audience of the service is `helpdesk`.
    The permission manifest of the service is in `services/helpdesk/manifest.json`.
    The event types of the service are in `services/helpdesk/events/event-types.json`.
  version: 0.0.0
tags: []
paths:
  /v1/customers:
    get:
      operationId: Customers_list
      description: |-
        List the customers. The order is `createdAt` descending, then `id` descending.
        The page token is opaque. A token of another operation or with other filters gives 400 `invalid_page_token`.
        A filter value that is not valid gives 400 `invalid_parameter`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - $ref: '#/components/parameters/CursorPageParams.pageToken'
        - $ref: '#/components/parameters/CursorPageParams.pageSize'
        - $ref: '#/components/parameters/CustomerFilters'
      responses:
        '200':
          description: A page response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      x-required-scopes:
        - helpdesk:customer:read
    post:
      operationId: Customers_create
      description: |-
        Create a customer. The service writes the event `helpdesk.customer.created`.
        Error code of `Conflict`: `customer_email_taken`. Two customers cannot have the same email address, with no case.
        Error code of `UnprocessableContent`: `validation_failed`. The response lists the fields that are not valid.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters: []
      responses:
        '201':
          description: A created Customer response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '409':
          description: The request conflicts with the state of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      x-required-scopes:
        - helpdesk:customer:write
  /v1/customers/{customerId}:
    get:
      operationId: Customers_get
      description: |-
        Get one customer. Error code of `NotFound`: `customer_not_found`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A Customer response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      x-required-scopes:
        - helpdesk:customer:read
    patch:
      operationId: Customers_update
      description: |-
        Change a customer. A field that is not in the body does not change. The service cannot delete the phone number.
        A body with no field gives 400 `empty_update`.
        An update with no real change returns 200 with the current customer. It writes no event and no audit entry.
        A real change writes the event `helpdesk.customer.updated`.
        Error code of `NotFound`: `customer_not_found`. Error code of `Conflict`: `customer_email_taken`.
        Error code of `UnprocessableContent`: `validation_failed`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - name: customerId
          in: path
          required: true
          description: ID of the customer.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A Customer response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: The request conflicts with the state of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      x-required-scopes:
        - helpdesk:customer:write
  /v1/tickets:
    get:
      operationId: Tickets_list
      description: |-
        List the tickets. The order is `createdAt` descending, then `id` descending.
        The page token is opaque. A token of another operation or with other filters gives 400 `invalid_page_token`.
        A filter value that is not valid gives 400 `invalid_parameter`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - $ref: '#/components/parameters/CursorPageParams.pageToken'
        - $ref: '#/components/parameters/CursorPageParams.pageSize'
        - $ref: '#/components/parameters/TicketFilters.status'
        - $ref: '#/components/parameters/TicketFilters.priority'
        - $ref: '#/components/parameters/TicketFilters.customerId'
      responses:
        '200':
          description: A page response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      x-required-scopes:
        - helpdesk:ticket:read
    post:
      operationId: Tickets_create
      description: |-
        Create a ticket. The status of the new ticket is `open`. The default priority is `normal`. The service sets the number.
        The token needs `helpdesk:ticket:write` only. The service checks that the customer exists. It does not need `helpdesk:customer:read`.
        The service writes the event `helpdesk.ticket.created`.
        Error code of `UnprocessableContent`: `customer_unknown` when the customer does not exist, or `validation_failed`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters: []
      responses:
        '201':
          description: A created Ticket response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      x-required-scopes:
        - helpdesk:ticket:write
  /v1/tickets/{ticketId}:
    get:
      operationId: Tickets_get
      description: |-
        Get one ticket. Error code of `NotFound`: `ticket_not_found`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - name: ticketId
          in: path
          required: true
          description: ID of the ticket.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A Ticket response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      x-required-scopes:
        - helpdesk:ticket:read
    patch:
      operationId: Tickets_update
      description: |-
        Change a ticket. A field that is not in the body does not change. The service cannot delete the description.
        A body with no field gives 400 `empty_update`.
        An update with no real change returns 200 with the current ticket. It writes no event and no audit entry.
        A change of the status writes the event `helpdesk.ticket.status_changed`. A change of other fields writes `helpdesk.ticket.updated`.
        Error code of `NotFound`: `ticket_not_found`. Error code of `UnprocessableContent`: `validation_failed`.
        The response has `Cache-Control: no-store` and `Pragma: no-cache`.
        Error code of `ServiceUnavailable`: `unavailable`. It has `Retry-After` when the database is not available.
      parameters:
        - name: ticketId
          in: path
          required: true
          description: ID of the ticket.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A Ticket response with the no-store headers.
          headers:
            Cache-Control:
              required: true
              description: Cache rule.
              schema:
                type: string
                enum:
                  - no-store
            Pragma:
              required: true
              description: Cache rule for old HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: The request is not valid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: The request has no valid credentials.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '403':
          description: The principal does not have the permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: The resource does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '422':
          description: The request is well formed, but the server cannot process its content.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnprocessableContent'
        '500':
          description: The server has an internal error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
        '503':
          description: The service is not available.
          headers:
            Retry-After:
              required: false
              description: Seconds to wait before the next request. Optional.
              schema:
                type: integer
                format: int32
                minimum: 0
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketUpdate'
      x-required-scopes:
        - helpdesk:ticket:write
security:
  - BearerAuth: []
components:
  parameters:
    CursorPageParams.pageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items in the page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50
      explode: false
    CursorPageParams.pageToken:
      name: pageToken
      in: query
      required: false
      description: Opaque token from `nextPageToken` of the previous page.
      schema:
        type: string
        maxLength: 1024
      explode: false
    CustomerFilters:
      name: email
      in: query
      required: false
      description: Return only the customer with this email address. The match is exact and has no case.
      schema:
        type: string
        minLength: 1
        maxLength: 254
      explode: false
    TicketFilters.customerId:
      name: customerId
      in: query
      required: false
      description: Return only the tickets of this customer.
      schema:
        type: string
        format: uuid
      explode: false
    TicketFilters.priority:
      name: priority
      in: query
      required: false
      description: Return only the tickets with this priority.
      schema:
        $ref: '#/components/schemas/TicketPriority'
      explode: false
    TicketFilters.status:
      name: status
      in: query
      required: false
      description: Return only the tickets with this status.
      schema:
        $ref: '#/components/schemas/TicketStatus'
      explode: false
  schemas:
    BadRequest:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request is not valid.
    Conflict:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: The request conflicts with the state of the resource.
    ContentTooLarge:
      type: object
      allOf:
        - $ref: '#/components/schemas/Problem'
      description: |-
        The request body is larger than the limit of the service. The code is `content_too_large`.
        The operator of the service sets the limit.
    Customer:
      type: object
      required:
        - id
        - name
        - email
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: ID of the customer. A UUID in lowercase text form.
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the customer.
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address of the customer. It is unique without case.
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: Phone number of the customer.
        createdAt:
          type: string
          format: date-time
          description: Time when the customer was created.
        updatedAt:
          type: string
          format: date-time
          description: Time when the customer was changed.
      description: A customer of the helpdesk.
    CustomerChangedField:
      type: string
      enum:
        - name
        - email
        - phone
      description: Fields of a customer that the event `helpdesk.customer.updated` can name.
    CustomerCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the customer.
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: Email address of the customer. It is unique without case.
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: Phone number of the customer.
      description: Request to create a customer.
    CustomerCreatedData:
      type: object
      required:
        - customerId
      properties:
        customerId:
          allOf:
            - $ref: '#/components/schemas/EventResourceId'
          description: ID of the customer.
      description: Data of the event `helpdesk.customer.created`. It has no personal data.
    CustomerCreatedEvent:
      type: object
      required:
        - specversion
        - id
        - source
        - type
        - time
        - datacontenttype
        - data
        - actor
        - actortype
      properties:
        specversion:
          type: string
          enum:
            - '1.0'
          description: CloudEvents version.
        id:
          type: string
          minLength: 1
          maxLength: 128
          description: ID of the event. Unique for each `source`.
        source:
          type: string
          minLength: 1
          maxLength: 256
          format: uri-reference
          description: URI reference of the service that made the event, for example `/helpdesk`.
        type:
          allOf:
            - $ref: '#/components/schemas/EventType'
          description: Type of the event.
        time:
          type: string
          format: date-time
          description: Time when the event happened.
        subject:
          type: string
          minLength: 1
          maxLength: 256
          description: ID of the resource, for example the ticket ID.
        datacontenttype:
          type: string
          enum:
            - application/json
          description: Media type of `data`.
        dataschema:
          type: string
          format: uri
          description: URI of the schema of `data`.
        data:
          allOf:
            - $ref: '#/components/schemas/CustomerCreatedData'
          description: Data of the event.
