kind: project
entrypoint: main.tsp
warn-as-error: true
emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/generated/openapi"
    openapi-versions: ["3.0.0"]
    file-type: yaml
    output-file: "{service-name}.openapi.yaml"
    new-line: lf
  "@typespec/json-schema":
    emitter-output-dir: "{output-dir}/json-schema"
    file-type: json
    int64-strategy: number
    seal-object-schemas: true
linter:
  extends:
    - "@typespec/http/all"
  enable:
    "@typespec/compiler/unused-using": true
    "@typespec/compiler/unused-template-parameter": true
