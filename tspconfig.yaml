kind: project
entrypoint: main.tsp
warn-as-error: true
emit:
  - "@typespec/openapi3"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/generated/openapi"
    openapi-versions: ["3.0.0"]
    file-type: yaml
    output-file: "{service-name}.openapi.yaml"
    new-line: lf
linter:
  extends:
    - "@typespec/http/all"
  enable:
    "@typespec/compiler/unused-using": true
    "@typespec/compiler/unused-template-parameter": true
